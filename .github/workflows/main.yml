name: Auto Test Every 30 Minutes

on:
  schedule:
    - cron: "*/30 * * * *" # প্রতি ৩০ মিনিট পর পর রান করার জন্য
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার সুবিধা রাখতে

permissions:
  contents: read

concurrency:
  group: auto-test-every-30-minutes
  cancel-in-progress: false

jobs:
  test:
    name: Test Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Test
        run: |
          echo "GitHub Actions 30-minute scheduled test started"
          echo "Current UTC time:"
          date -u
          echo "Test successful at $(date)"
