
name: Build Active M3U Playlist

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Source M3U playlist URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check streams and build playlist
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: python check_playlist.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add active_playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update active playlist"
            git push
          fi
