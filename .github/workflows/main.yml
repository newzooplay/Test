
name: Public Network Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Inspect target HTTP response
        shell: bash
        run: |
          set -eu

          TARGET='https://sportlinks.pages.dev/?id=tntsports1'

          mkdir -p report

          echo "Target: $TARGET"

          echo "=== DNS lookup ==="
          host sportlinks.pages.dev || true

          echo "=== HTTP response and redirects ==="
          curl \
            --silent \
            --show-error \
            --location \
            --max-redirs 5 \
            --max-time 30 \
            --output report/page.html \
            --dump-header report/headers.txt \
            --write-out \
            'HTTP status: %{http_code}\nFinal URL: %{url_effective}\nContent type: %{content_type}\nRedirects: %{num_redirects}\nTotal time: %{time_total}s\n' \
            "$TARGET" || true

          echo "=== Response headers ==="
          sed -n '1,100p' report/headers.txt

          echo "=== HTML resource references ==="
          python3 - <<'PY'
          from html.parser import HTMLParser

          class ResourceParser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if value and tag in (
                          "script", "link", "iframe", "video", "source"
                      ):
                          print(f"{tag} {key}: {value}")

          try:
              with open("report/page.html", encoding="utf-8",
                        errors="replace") as f:
                  ResourceParser().feed(f.read())
          except OSError as e:
              print(f"Could not read HTML: {e}")
          PY

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-network-report
          path: report/
          if-no-files-found: warn
          retention-days: 3
