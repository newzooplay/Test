
name: Website Page Analyzer

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: website-page-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze Website Page
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Website Analyzer
        run: |
          python analyzer.py

      - name: Validate Report
        if: success()
        run: |
          python -c "import json; json.load(open('report.json', encoding='utf-8')); print('Report JSON is valid')"

      - name: Upload Analysis Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-analysis-report
          path: report.json
          if-no-files-found: warn
          retention-days: 7
