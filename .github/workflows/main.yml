
      - name: Inspect public channel metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          urls = [
              "https://sonujson-v5.pages.dev/loura.json",
              "https://sportlink-tv10.pages.dev/id.json",
          ]

          def normalise(raw):
              if isinstance(raw, list):
                  return raw
              if not isinstance(raw, dict):
                  return []
              for key in ("iframes", "channels", "data"):
                  if isinstance(raw.get(key), list):
                      return raw[key]
              return [raw]

          for url in urls:
              print("\nSOURCE:", url)
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Network-Analysis/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = json.loads(response.read().decode("utf-8"))

                  entries = normalise(raw)
                  print("Entries:", len(entries))

                  for item in entries:
                      if not isinstance(item, dict):
                          continue
                      if str(item.get("id")) == "tntsports1":
                          # Avoid printing tracking tokens or query parameters.
                          print("Matching channel:")
                          print("  id:", item.get("id"))
                          print("  name:", item.get("name"))
                          print("  category:", item.get("category"))
                          print("  has iframeSrc:", bool(item.get("iframeSrc")))
                          print("  has hit:", bool(item.get("hit")))

              except Exception as exc:
                  print("Analysis failed:", type(exc).__name__, str(exc))
          PY
