
name: Website Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: website-diagnostics
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TARGET_URL: https://v4jxp5.movielinkbd.at/movie/mKs_ojqfqk3njpyykzcnckj3ykxtli
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run website analyzer
        id: analyzer
        continue-on-error: true
        run: python analyzer.py

      - name: Commit and push report
        if: always()
        run: |
          mkdir -p reports

          if [ ! -f reports/report.json ]; then
            echo '{"error":"Analyzer did not produce a report"}' \
              > reports/report.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/report.json

          if ! git diff --cached --quiet; then
            git commit -m "Update website diagnostics report"
            git push origin HEAD:main
          else
            echo "No report changes to commit."
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-diagnostics-report
          path: reports/report.json
          if-no-files-found: warn
          retention-days: 7
